services:
  squad-rendezvous:
    build: .
    container_name: squad-rendezvous
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Ensure UDP port 3478 is open in your VPS firewall (e.g., `sudo ufw allow 3478/udp`).
    ports:
      - "3478:3478/udp"
    environment:
      RUST_LOG: squad_rendezvous=info
