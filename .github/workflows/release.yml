name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag (e.g. v0.1.0). Leave empty for a dry-run artifact build."
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos-and-windows:
    name: Build macOS ARM64 & Windows x86_64 Installers
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install MinGW-w64
        run: brew install mingw-w64

      - name: Build macOS .pkg and Windows .exe installers
        run: |
          chmod +x scripts/package_installers.sh
          ./scripts/package_installers.sh

      - name: Build squad-rendezvous (macOS ARM64)
        run: |
          cargo build --release --locked -p squad-rendezvous
          tar -C target/release -czf dist/squad-rendezvous-macos-arm64.tar.gz squad-rendezvous

      - name: Upload macOS & Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-windows
          path: |
            dist/Squad-Air-Installer-macos-arm64.pkg
            dist/Squad-Air-Setup-windows-x86_64.exe
            dist/squad-rendezvous-macos-arm64.tar.gz

  build-linux:
    name: Build Linux x86_64 Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            nasm \
            pkg-config \
            libopus-dev \
            libasound2-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libx11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --locked -p squad-rendezvous -p squad-client

      - name: Package Linux tarballs
        run: |
          mkdir -p dist
          tar -C target/release -czf dist/squad-rendezvous-linux-x86_64.tar.gz squad-rendezvous
          tar -C target/release -czf dist/squad-client-linux-x86_64.tar.gz squad-client

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/squad-rendezvous-linux-x86_64.tar.gz
            dist/squad-client-linux-x86_64.tar.gz

  build-windows-rendezvous:
    name: Build Windows x86_64 Rendezvous Binary
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build squad-rendezvous (Windows x86_64)
        run: cargo build --release --locked -p squad-rendezvous

      - name: Package Windows rendezvous archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target/release/squad-rendezvous.exe -DestinationPath dist/squad-rendezvous-windows-x86_64.zip -Force

      - name: Upload Windows rendezvous artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-rendezvous
          path: dist/squad-rendezvous-windows-x86_64.zip

  release:
    name: Publish GitHub Release
    needs: [build-macos-and-windows, build-linux, build-windows-rendezvous]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
