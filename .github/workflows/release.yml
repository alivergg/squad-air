name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".dockerignore"
      - "site/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional explicit release tag (e.g. v1.0). Leave empty to auto-increment vX.X."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-version:
    name: Determine Release Version
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.version.outputs.version_tag }}
      version_num: ${{ steps.version.outputs.version_num }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next vX.X release tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          git fetch --tags --force >/dev/null 2>&1 || true
          if [[ -n "${INPUT_TAG}" ]]; then
            NUM="${INPUT_TAG#v}"
            TAG="v${NUM}"
          else
            LATEST="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            if [[ -z "${LATEST}" ]]; then
              NUM="1.0"
            else
              MAJOR="$(echo "${LATEST#v}" | cut -d. -f1)"
              MINOR="$(echo "${LATEST#v}" | cut -d. -f2)"
              NUM="${MAJOR}.$((MINOR + 1))"
            fi
            TAG="v${NUM}"
          fi
          echo "version_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_num=${NUM}" >> "$GITHUB_OUTPUT"
          echo "Selected release version: ${TAG} (${NUM})"

  build-macos-and-windows:
    name: Build macOS ARM64 & Windows x86_64 Installers
    needs: prepare-version
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install MinGW-w64
        run: brew install mingw-w64

      - name: Build macOS .pkg and Windows .exe installers
        env:
          SQUADAIR_VERSION: ${{ needs.prepare-version.outputs.version_num }}
        run: |
          chmod +x scripts/package_installers.sh
          ./scripts/package_installers.sh

      - name: Build squad-rendezvous (macOS ARM64)
        run: |
          cargo build --release --locked -p squad-rendezvous
          tar -C target/release -czf dist/squad-rendezvous-macos-arm64.tar.gz squad-rendezvous

      - name: Upload macOS & Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-windows
          path: |
            dist/SquadAir-Installer-macos-arm64.pkg
            dist/SquadAir-Setup-windows-x86_64.exe
            dist/squad-client-windows-x86_64.zip
            dist/squad-rendezvous-macos-arm64.tar.gz

  build-linux:
    name: Build Linux Packages (.deb, .rpm, Arch, .tar.gz)
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            nasm \
            pkg-config \
            libopus-dev \
            libasound2-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libx11-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            libxkbcommon-dev \
            dpkg-dev \
            rpm \
            fakeroot \
            libarchive-tools \
            zstd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        env:
          SQUADAIR_VERSION: ${{ needs.prepare-version.outputs.version_num }}
        run: cargo build --release --locked -p squad-rendezvous -p squad-client

      - name: Package Linux distributions (.deb, .rpm, .pkg.tar.zst, .tar.gz)
        run: |
          chmod +x scripts/package_linux.sh
          ./scripts/package_linux.sh "${{ needs.prepare-version.outputs.version_num }}"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/squad-air_*.deb
            dist/squad-air-*.rpm
            dist/squad-air-*.pkg.tar.zst
            dist/PKGBUILD
            dist/squad-rendezvous-linux-x86_64.tar.gz
            dist/squad-client-linux-x86_64.tar.gz

  build-windows-rendezvous:
    name: Build Windows x86_64 Rendezvous Binary
    needs: prepare-version
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build squad-rendezvous (Windows x86_64)
        run: cargo build --release --locked -p squad-rendezvous

      - name: Package Windows rendezvous archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target/release/squad-rendezvous.exe -DestinationPath dist/squad-rendezvous-windows-x86_64.zip -Force

      - name: Upload Windows rendezvous artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-rendezvous
          path: dist/squad-rendezvous-windows-x86_64.zip

  build-windows-msix:
    name: Build Windows x86_64 MSIX (Microsoft Store)
    needs: prepare-version
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build Microsoft Store MSIX package
        shell: pwsh
        run: ./scripts/package_msix.ps1 -Version "${{ needs.prepare-version.outputs.version_num }}"

      - name: Upload Windows MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-msix
          path: dist/SquadAir-msix-windows-x86_64.msix

  release:
    name: Publish GitHub Release
    needs:
      - prepare-version
      - build-macos-and-windows
      - build-linux
      - build-windows-rendezvous
      - build-windows-msix
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Remove non-release staging artifacts from public GitHub Release assets
        run: rm -f release-assets/SquadAir-msix-windows-x86_64.msix release-assets/*.snap

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-version.outputs.version_tag }}
          name: "SquadAir ${{ needs.prepare-version.outputs.version_tag }}"
          target_commitish: ${{ github.sha }}
          body: |
            Official website & downloads: **https://squadair.app/**
          generate_release_notes: true
          files: release-assets/*

  publish-microsoft-store:
    name: Publish MSIX to Microsoft Store
    needs:
      - prepare-version
      - build-windows-msix
      - release
    runs-on: windows-latest
    steps:
      - name: Download Windows MSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: release-windows-msix
          path: msix-assets

      - name: Setup Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Publish MSIX package to Partner Center
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURE_AD_TENANT_ID) -or
              [string]::IsNullOrWhiteSpace($env:AZURE_AD_APPLICATION_CLIENT_ID) -or
              [string]::IsNullOrWhiteSpace($env:AZURE_AD_APPLICATION_SECRET)) {
            Write-Host "Microsoft Store Entra ID secrets are not configured yet; skipping automatic Store submission."
            exit 0
          }
          $sellerId = if ([string]::IsNullOrWhiteSpace($env:SELLER_ID)) { "97509190" } else { $env:SELLER_ID }
          msstore reconfigure `
            --tenantId $env:AZURE_AD_TENANT_ID `
            --sellerId $sellerId `
            --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID `
            --clientSecret $env:AZURE_AD_APPLICATION_SECRET
          if ($LASTEXITCODE -ne 0) {
            throw "msstore reconfigure failed with exit code $LASTEXITCODE"
          }
          msstore publish "msix-assets/SquadAir-msix-windows-x86_64.msix" --productId "9PH8NXTQMC73"
          if ($LASTEXITCODE -ne 0) {
            throw "msstore publish failed with exit code $LASTEXITCODE"
          }

  build-snap:
    name: Build & Publish Linux Snap
    needs: prepare-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Snap version
        env:
          VERSION: ${{ needs.prepare-version.outputs.version_num }}
        run: |
          sed -i "s/^version:.*/version: \"${VERSION}\"/" snap/snapcraft.yaml

      - name: Build Snap package
        id: snap-build
        uses: snapcore/action-build@v1
        with:
          snapcraft-channel: latest/stable

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-snap
          path: ${{ steps.snap-build.outputs.snap }}

      - name: Check Snap Store credentials
        id: snap-auth
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [[ -n "${SNAPCRAFT_STORE_CREDENTIALS}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SNAPCRAFT_STORE_CREDENTIALS secret not configured yet; skipping Snap Store publish."
          fi

      - name: Publish to Snap Store
        if: steps.snap-auth.outputs.configured == 'true'
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          store_login: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          snap: ${{ steps.snap-build.outputs.snap }}
          release: stable

  publish-homebrew-tap:
    name: Update Homebrew Tap (alivergg/homebrew-tap)
    needs:
      - prepare-version
      - build-macos-and-windows
      - release
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS & Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-macos-windows
          path: artifacts

      - name: Update Homebrew Cask
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare-version.outputs.version_num }}
        run: |
          if [[ -z "${TAP_GITHUB_TOKEN}" ]]; then
            echo "TAP_GITHUB_TOKEN secret not configured yet; skipping Homebrew tap update."
            exit 0
          fi
          SHA="$(sha256sum artifacts/SquadAir-Installer-macos-arm64.pkg | awk '{print $1}')"
          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/alivergg/homebrew-tap.git" tap
          cat > tap/Casks/squadair.rb <<EOF
          cask "squadair" do
            arch arm: "arm64"

            version "${VERSION}"
            sha256 "${SHA}"

            url "https://github.com/alivergg/squad-air/releases/download/v#{version}/SquadAir-Installer-macos-arm64.pkg",
                verified: "github.com/alivergg/squad-air/"
            name "SquadAir"
            desc "Ultra-lightweight P2P voice chat and 1080p60 screen sharing built in Rust"
            homepage "https://squadair.app/"

            depends_on macos: ">= :ventura"
            depends_on arch: :arm64

            pkg "SquadAir-Installer-macos-arm64.pkg"

            uninstall quit:    "com.squadair.client",
                      pkgutil: "com.squadair.client",
                      delete:  "/Applications/SquadAir.app"

            zap trash: [
              "~/Library/Application Support/squad-air",
              "~/Library/Caches/squad-air",
            ]
          end
          EOF
          ruby -c tap/Casks/squadair.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/squadair.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore(squadair): release v${VERSION}"
            git push origin HEAD:main
          fi

  publish-scoop-bucket:
    name: Update Scoop Bucket (alivergg/scoop-bucket)
    needs:
      - prepare-version
      - build-macos-and-windows
      - release
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS & Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-macos-windows
          path: artifacts

      - name: Update Scoop Manifest
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare-version.outputs.version_num }}
        run: |
          if [[ -z "${TAP_GITHUB_TOKEN}" ]]; then
            echo "TAP_GITHUB_TOKEN secret not configured yet; skipping Scoop bucket update."
            exit 0
          fi
          SHA="$(sha256sum artifacts/squad-client-windows-x86_64.zip | awk '{print $1}')"
          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/alivergg/scoop-bucket.git" bucket
          python3 - "$VERSION" "$SHA" "bucket/bucket/squadair.json" <<'PY'
          import json, sys
          version, sha, path = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(path) as f:
              data = json.load(f)
          data["version"] = version
          data["architecture"]["64bit"]["url"] = f"https://github.com/alivergg/squad-air/releases/download/v{version}/squad-client-windows-x86_64.zip"
          data["architecture"]["64bit"]["hash"] = sha
          with open(path, "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY
          python3 -m json.tool bucket/bucket/squadair.json >/dev/null
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/squadair.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(squadair): release v${VERSION}"
            git push origin HEAD:main
          fi

  publish-winget:
    name: Submit Winget Update (microsoft/winget-pkgs)
    needs:
      - prepare-version
      - release
    runs-on: ubuntu-latest
    steps:
      - name: Check Winget token
        id: winget-auth
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [[ -z "${WINGET_TOKEN}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "WINGET_TOKEN secret not configured yet; skipping winget-pkgs PR."
          elif ! curl -fsSI \
            -H "Authorization: Bearer ${WINGET_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/s/SquadAir/SquadAir" >/dev/null 2>&1; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SquadAir.SquadAir is not merged into microsoft/winget-pkgs master yet; skipping winget-releaser update."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Submit PR to winget-pkgs
        if: steps.winget-auth.outputs.configured == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: SquadAir.SquadAir
          version: ${{ needs.prepare-version.outputs.version_num }}
          release-tag: ${{ needs.prepare-version.outputs.version_tag }}
          installers-regex: '^SquadAir-Setup-windows-x86_64\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

  publish-aur:
    name: Update AUR Package (squad-air-bin)
    needs:
      - prepare-version
      - build-linux
      - release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: artifacts

      - name: Push updated PKGBUILD and .SRCINFO to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ needs.prepare-version.outputs.version_num }}
        run: |
          if [[ -z "${AUR_SSH_PRIVATE_KEY}" ]]; then
            echo "AUR_SSH_PRIVATE_KEY secret not configured yet; skipping AUR publish."
            exit 0
          fi
          ARCH_VER="${VERSION//-/_}"
          PKG_FILE="artifacts/squad-air-${ARCH_VER}-1-x86_64.pkg.tar.zst"
          SHA="$(sha256sum "${PKG_FILE}" | awk '{print $1}')"
          mkdir -p ~/.ssh
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > ~/.ssh/aur_id
          chmod 600 ~/.ssh/aur_id
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_id -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/squad-air-bin.git aur-repo
          chmod +x scripts/update_aur_pkgbuild.sh
          ./scripts/update_aur_pkgbuild.sh "${VERSION}" "${SHA}" aur-repo
          cd aur-repo
          git config user.name "SquadAir Release Bot"
          git config user.email "support@squadair.app"
          git add PKGBUILD .SRCINFO
          if ! git diff --cached --quiet; then
            git commit -m "Update to v${VERSION}"
            git push origin HEAD:master
          fi
